services:
  db:
    image: postgres:16-alpine
    container_name: s_media_api_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-s_media_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-s_media_api}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  api:
    image: ghcr.io/sergueimoscow/s_media_api:latest
    build: .
    container_name: s_media_api
    volumes:
      - ./.env:/app/.env:ro
      - staticfiles:/app/staticfiles
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  api_nginx:
    image: nginx:alpine
    container_name: s_media_api_nginx
    ports:
      - "8000:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/static:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: always

volumes:
  pgdata:
  staticfiles:
