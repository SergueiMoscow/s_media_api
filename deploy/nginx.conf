server {
    listen 443 ssl;
    http2 on;
    server_name stage.b-site.ru;

    ssl_certificate /etc/letsencrypt/live/stage.b-site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.b-site.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200M;

    # Security: закрыто на уровне nginx (фронт их не использует).
    location = /profile { return 403; }
    location /profile/ { return 403; }
    location = /users { return 403; }
    location /users/ { return 403; }
    location = /groups { return 403; }
    location /groups/ { return 403; }

    location /static/ {
        alias /static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Перемотка видео: проброс Range и отключение буферизации ответа.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
